name: check-code-format

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          # The newer Ubuntu runners no longer have the clang-format-14 package: the same
          # version comes from PyPI (the official LLVM build packaged as a wheel).
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet clang-format==14.0.6
          ln -s "$RUNNER_TEMP/clang-format/bin/clang-format" "$RUNNER_TEMP/clang-format/bin/clang-format-14"
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang-format/bin/clang-format-14" --version

      - name: Check style
        run: |
          FILES=`find . -type f -name "*.h" -o -name "*.c" -o -name "*.cpp"`
          FILTERED_FILES=()
          for file in ${FILES[@]};
          do
            [[ $file =~ "./src/" ]] &&
            [[ ! $file =~ "spatialmedia" ]] &&
            [[ ! $file =~ "defaultlayouts.h" ]] &&
            [[ ! $file =~ "_autogen" ]] &&
            FILTERED_FILES+=($file)
          done
          clang-format-14 --verbose --dry-run --Werror -style=file -i ${FILTERED_FILES[@]}
          if [ $? -eq 0 ]
          then
            echo "SUCCESS: All files are formatted correctly"
            exit 0
          else
          echo "FAILURE: some files are formatted incorrectly"
            exit 99
          fi
